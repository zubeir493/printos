models:

  Partner:
    name: string
    phone: string nullable
    address: text nullable
    tin_number: string nullable
    is_supplier: boolean default:false
    is_customer: boolean default:false
    timestamps: true
    relationships:
      hasMany: JobOrder, SalesInvoice, PurchaseOrder, PurchaseInvoice, Payment

  JobOrder:
    job_order_number: string unique
    partner_id: integer foreign
    job_type: enum:books,packages
    production_mode: string nullable
    services: json
    submission_date: date
    due_date: date nullable
    remarks: text nullable
    advance_paid: boolean default:false
    cost_calc_file: string
    advance_amount: decimal:12,2
    total_price: decimal:12,2
    status: enum:draft,design,production,completed,cancelled
    timestamps: true
    relationships:
      belongsTo: Partner
      hasMany: JobOrderTask, Dispatch, SalesInvoice
      morphMany: StockMovement (reference), PaymentAllocation (allocatable)
      hasManyThrough: MaterialRequest (JobOrderTask)
      hasManyThrough: Artwork (JobOrderTask)

  JobOrderTask:
    job_order_id: integer foreign
    designer_id: integer foreign nullable
    name: string
    quantity: integer
    task_cost: decimal:12,2
    unit_cost: decimal:12,2
    paper: json nullable
    status: string nullable
    size: string nullable
    timestamps: true
    relationships:
      belongsTo: JobOrder, User (designer_id), Size (size)
      hasMany: DispatchItem, MaterialRequest, Artwork, ProductionPlanItem

  Artwork:
    job_order_id: integer foreign
    job_order_task_id: integer foreign nullable
    filename: string
    is_approved: boolean default:false
    uploaded_by: integer foreign nullable
    timestamps: true
    relationships:
      belongsTo: JobOrderTask, JobOrder, User (uploaded_by)

  Dispatch:
    job_order_id: integer foreign
    warehouse_id: integer foreign
    delivery_date: date
    remarks: text nullable
    timestamps: true
    relationships:
      belongsTo: Warehouse, JobOrder
      hasMany: DispatchItem

  DispatchItem:
    dispatch_id: integer foreign
    job_order_task_id: integer foreign
    quantity: integer
    timestamps: true
    relationships:
      belongsTo: Dispatch, JobOrderTask

  Employee:
    employee_id: string
    first_name: string
    last_name: string
    image: string nullable
    phone: string nullable
    hire_date: date
    status: string
    department: string nullable
    position: string nullable
    basic_salary: decimal:15,2
    hourly_overtime_rate: decimal:15,2 nullable
    holiday_overtime_rate: decimal:15,2 nullable
    payment_method: string nullable
    bank_name: string nullable
    account_number: string nullable
    softDeletes: true
    timestamps: true
    relationships:
      hasMany: EmployeeSalaryHistory

  EmployeeSalaryHistory:
    employee_id: integer foreign
    basic_salary: decimal:15,2
    hourly_overtime_rate: decimal:15,2 nullable
    holiday_overtime_rate: decimal:15,2 nullable
    effective_date: date
    change_reason: text nullable
    timestamps: true
    relationships:
      belongsTo: Employee

  GoodsReceipt:
    receipt_number: string unique
    purchase_order_id: integer foreign
    warehouse_id: integer foreign
    receipt_date: date
    status: enum:draft,posted default:draft
    timestamps: true
    relationships:
      belongsTo: PurchaseOrder, Warehouse
      hasMany: GoodsReceiptItem

  GoodsReceiptItem:
    goods_receipt_id: integer foreign
    purchase_order_item_id: integer foreign
    quantity_received: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: GoodsReceipt, PurchaseOrderItem

  InventoryItem:
    name: string
    sku: string unique
    image: string nullable
    unit: string
    purchase_unit: string nullable
    conversion_factor: decimal:12,4 nullable
    type: string nullable
    is_sellable: boolean default:false
    price: decimal:15,2 nullable
    average_cost: decimal:15,2 default:0
    timestamps: true
    relationships:
      hasMany: InventoryBalance, StockMovement

  InventoryBalance:
    inventory_item_id: integer foreign
    warehouse_id: integer foreign
    quantity_on_hand: decimal:15,2 default:0
    timestamps: true
    relationships:
      belongsTo: InventoryItem, Warehouse

  JobOrderOutput:
    job_order_id: integer foreign
    inventory_item_id: integer foreign
    warehouse_id: integer foreign
    quantity: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: JobOrder, InventoryItem, Warehouse

  JournalEntry:
    date: date
    reference: string
    source_type: string nullable
    source_id: integer nullable
    narration: text nullable
    total_debit: decimal:15,2
    total_credit: decimal:15,2
    status: enum:draft,posted,void
    posted_at: datetime nullable
    voided_at: datetime nullable
    timestamps: true
    relationships:
      hasMany: JournalItem

  JournalItem:
    journal_entry_id: integer foreign
    account_id: integer foreign
    debit: decimal:15,2 default:0
    credit: decimal:15,2 default:0
    timestamps: true
    relationships:
      belongsTo: JournalEntry, Account

  Machine:
    name: string
    code: string nullable
    baseline_rounds_per_week: integer nullable
    timestamps: true
    relationships:
      hasMany: ProductionPlanItem

  MaterialRequest:
    job_order_task_id: integer foreign
    inventory_item_id: integer foreign
    required_quantity: decimal:10,2 default:0
    requested_quantity: decimal:10,2 default:0
    issued_quantity: decimal:10,2 default:0
    reason: text nullable
    timestamps: true
    relationships:
      belongsTo: JobOrderTask, InventoryItem
      hasMany: MaterialIssueApproval

  MaterialIssueApproval:
    material_request_id: integer foreign
    warehouse_id: integer foreign
    requested_by: integer foreign
    processed_by: integer foreign nullable
    quantity: decimal:15,2
    status: string
    reason: text nullable
    decision_notes: text nullable
    approved_at: datetime nullable
    rejected_at: datetime nullable
    timestamps: true
    relationships:
      belongsTo: MaterialRequest, Warehouse, User (requested_by), User (processed_by)

  Payment:
    payment_number: string unique
    partner_id: integer foreign
    job_order_id: integer foreign nullable
    bank_id: integer foreign nullable
    payment_date: date
    amount: decimal:15,2
    transaction_type: string nullable
    direction: enum:inbound,outbound
    method: enum:cash,bank,cheque
    reference: string nullable
    voided_at: datetime nullable
    payment_type: string nullable
    account_id: integer foreign nullable
    expense_account_id: integer foreign nullable
    petty_cash_account_id: integer foreign nullable
    timestamps: true
    relationships:
      belongsTo: Partner, Account, Account (expense_account_id), Account (petty_cash_account_id), Bank, JobOrder
      hasMany: PaymentAllocation

  PaymentAllocation:
    payment_id: integer foreign
    allocatable_id: integer
    allocatable_type: string
    allocated_amount: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: Payment
      morphTo: allocatable

  ProductionPlan:
    week_start: date
    week_end: date
    status: string default:draft
    timestamps: true
    relationships:
      hasMany: ProductionPlanMachine, ProductionReport

  ProductionPlanItem:
    production_plan_machine_id: integer foreign
    job_order_task_id: integer foreign
    planned_quantity: decimal:15,2
    planned_plates: integer default:0
    planned_rounds: integer default:0
    timestamps: true
    relationships:
      belongsTo: ProductionPlanMachine, JobOrderTask
      hasMany: ProductionReportItem

  ProductionPlanMachine:
    production_plan_id: integer foreign
    machine_id: integer foreign
    timestamps: true
    relationships:
      belongsTo: ProductionPlan, Machine
      hasMany: ProductionPlanItem

  ProductionReport:
    production_plan_id: integer foreign
    status: string default:draft
    timestamps: true
    relationships:
      belongsTo: ProductionPlan
      hasMany: ProductionReportMachine

  ProductionReportItem:
    production_report_machine_id: integer foreign
    production_plan_item_id: integer foreign
    date: date
    actual_quantity: decimal:15,2
    plates_used: integer default:0
    rounds: integer default:0
    timestamps: true
    relationships:
      belongsTo: ProductionReportMachine, ProductionPlanItem

  ProductionReportMachine:
    production_report_id: integer foreign
    production_plan_machine_id: integer foreign
    timestamps: true
    relationships:
      belongsTo: ProductionReport, ProductionPlanMachine
      hasMany: ProductionReportItem

  PurchaseOrder:
    po_number: string unique
    partner_id: integer foreign
    order_date: date
    due_date: date nullable
    status: enum:draft,approved,received,cancelled
    subtotal: decimal:15,2 nullable
    timestamps: true
    relationships:
      belongsTo: Partner
      hasMany: PurchaseOrderItem, GoodsReceipt
      morphMany: PaymentAllocation (allocatable)

  PurchaseOrderItem:
    purchase_order_id: integer foreign
    inventory_item_id: integer foreign
    quantity: decimal:12,2
    unit_price: decimal:12,2
    total: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: PurchaseOrder, InventoryItem

  SalesOrder:
    order_number: string unique
    warehouse_id: integer foreign
    partner_id: integer foreign nullable
    order_date: date
    due_date: date nullable
    payment_mode: string nullable
    payment_method: string nullable
    payment_reference: string nullable
    subtotal: decimal:15,2 default:0
    total: decimal:15,2 default:0
    status: enum:draft,completed,void default:draft
    timestamps: true
    relationships:
      belongsTo: Warehouse, Partner
      hasMany: SalesOrderItem
      morphMany: PaymentAllocation (allocatable)

  SalesOrderItem:
    sales_order_id: integer foreign
    inventory_item_id: integer foreign
    quantity: decimal:15,2 default:1
    unit_price: decimal:15,2 default:0
    total: decimal:15,2 default:0
    timestamps: true
    relationships:
      belongsTo: SalesOrder, InventoryItem

  StockAdjustment:
    adjustment_number: string unique
    warehouse_id: integer foreign
    adjustment_date: date
    status: string default:draft
    reason: text nullable
    created_by: integer foreign nullable
    posted_at: datetime nullable
    timestamps: true
    relationships:
      belongsTo: Warehouse, User (created_by)
      hasMany: StockAdjustmentItem

  StockAdjustmentItem:
    stock_adjustment_id: integer foreign
    inventory_item_id: integer foreign
    system_quantity: decimal:15,2
    counted_quantity: decimal:15,2
    difference: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: StockAdjustment, InventoryItem

  StockMovement:
    inventory_item_id: integer foreign
    warehouse_id: integer foreign
    type: enum:purchase,consumption,transfer_in,transfer_out,adjustment
    reference_type: string nullable
    reference_id: integer nullable
    quantity: decimal:15,2
    unit_cost: decimal:15,2 nullable
    total_cost: decimal:15,2 nullable
    movement_date: date
    timestamps: true
    relationships:
      belongsTo: InventoryItem, Warehouse

  StockTransfer:
    transfer_number: string unique
    from_warehouse_id: integer foreign
    to_warehouse_id: integer foreign
    transfer_date: date
    status: enum:draft,completed,cancelled
    timestamps: true
    relationships:
      belongsTo: Warehouse (from_warehouse_id), Warehouse (to_warehouse_id)
      hasMany: StockTransferItem

  StockTransferItem:
    stock_transfer_id: integer foreign
    inventory_item_id: integer foreign
    quantity: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: StockTransfer, InventoryItem

  Warehouse:
    name: string
    code: string unique
    location: string nullable
    is_default: boolean default:false
    timestamps: true
    relationships:
      hasMany: InventoryBalance, StockMovement
      belongsToMany: User

  User:
    name: string
    email: string unique
    password: string
    role: string
    email_verified_at: datetime nullable
    timestamps: true
    relationships:
      hasMany: JobOrderTask (designer_id), Artwork (uploaded_by), MaterialIssueApproval (requested_by), MaterialIssueApproval (processed_by), StockAdjustment (created_by), BankTransfer (created_by), BankTransfer (completed_by), Import, Export
      belongsToMany: Warehouse

  Size:
    size: string
    timestamps: true
    relationships: {}

  # SALES

  SalesInvoice:
    invoice_number: string unique
    partner_id: integer foreign
    job_order_id: integer foreign nullable
    issue_date: date
    due_date: date
    subtotal: decimal:15,2
    tax_amount: decimal:15,2 default:0
    total_amount: decimal:15,2
    status: enum:draft,issued,partially_paid,paid,void
    timestamps: true
    relationships:
      belongsTo: Partner, JobOrder
      hasMany: SalesInvoiceItem
      morphMany: PaymentAllocation (allocatable)

  SalesInvoiceItem:
    sales_invoice_id: integer foreign
    description: string
    quantity: decimal:12,2
    unit_price: decimal:12,2
    total: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: SalesInvoice

  # PURCHASES

  PurchaseInvoice:
    invoice_number: string
    partner_id: integer foreign
    purchase_order_id: integer foreign nullable
    issue_date: date
    due_date: date
    subtotal: decimal:15,2
    tax_amount: decimal:15,2 default:0
    total_amount: decimal:15,2
    status: enum:draft,posted,partially_paid,paid,void
    timestamps: true
    relationships:
      belongsTo: Partner, PurchaseOrder
      hasMany: PurchaseInvoiceItem
      morphMany: PaymentAllocation (allocatable)

  PurchaseInvoiceItem:
    purchase_invoice_id: integer foreign
    inventory_item_id: integer foreign
    quantity: decimal:12,2
    unit_price: decimal:12,2
    total: decimal:15,2
    timestamps: true
    relationships:
      belongsTo: PurchaseInvoice, InventoryItem

  # ACCOUNTING

  Account:
    name: string
    code: string unique
    type: enum:Asset,Liability,Equity,Revenue,Expense
    timestamps: true
    relationships:
      hasMany: JournalItem

  # BANKING

  Bank:
    name: string
    code: string nullable
    account_number: string nullable
    account_holder_name: string nullable
    bank_name: string nullable
    branch: string nullable
    current_balance: decimal:15,2
    status: string nullable
    notes: text nullable
    timestamps: true
    relationships:
      hasMany: Payment, BankTransfer (from_bank_id), BankTransfer (to_bank_id)

  BankTransfer:
    transfer_number: string unique
    from_bank_id: integer foreign
    to_bank_id: integer foreign
    amount: decimal:15,2
    transfer_date: date
    reference: string nullable
    description: text nullable
    status: string
    created_by: integer foreign nullable
    completed_by: integer foreign nullable
    completed_at: datetime nullable
    timestamps: true
    relationships:
      belongsTo: Bank (from_bank_id), Bank (to_bank_id), User (created_by), User (completed_by)

  # IMPORT/EXPORT

  Import:
    completed_at: timestamp nullable
    file_name: string
    file_path: string
    importer: string
    processed_rows: unsignedInteger default:0
    total_rows: unsignedInteger
    successful_rows: unsignedInteger default:0
    user_id: integer foreign
    timestamps: true
    relationships:
      belongsTo: User
      hasMany: FailedImportRow

  FailedImportRow:
    data: json
    import_id: integer foreign
    validation_error: text nullable
    timestamps: true
    relationships:
      belongsTo: Import

  Export:
    completed_at: timestamp nullable
    file_disk: string
    file_name: string nullable
    exporter: string
    processed_rows: unsignedInteger default:0
    total_rows: unsignedInteger
    successful_rows: unsignedInteger default:0
    user_id: integer foreign
    timestamps: true
    relationships:
      belongsTo: User

  # System Models

  EmailLog:
    recipient_email: string
    subject: string
    message: text
    artwork_id: integer foreign nullable
    sent_by: integer foreign
    sent_at: datetime
    timestamps: true
    relationships:
      belongsTo: Artwork, User (sent_by)