name: Production stack smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.production.yaml
      COMPOSE_ENV_FILES: .env.production
    steps:
      - uses: actions/checkout@v4
      - name: Audit locked dependencies
        run: |
          docker run --rm -v "$PWD:/app:ro" composer:2 audit --locked --no-dev --no-interaction
          docker run --rm -v "$PWD:/app:ro" -w /app node:22-bookworm-slim npm audit --audit-level=high
      - name: Configure isolated services
        run: |
          sed -e 's/^APP_DOMAIN=.*/APP_DOMAIN=localhost/' \
              -e 's|^APP_URL=.*|APP_URL=https://localhost|' \
              -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
              -e "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=$(openssl rand -hex 24)/" \
              -e 's/^DB_BACKUP_DISK=.*/DB_BACKUP_DISK=local/' \
              .env.production.example > .env.production
          docker compose config --quiet
      - name: Build and start PrintOS
        run: |
          docker compose build app
          docker compose up -d --wait --wait-timeout 240
      - name: Check HTTPS, built assets and the scheduler
        run: |
          curl --insecure --fail --silent --show-error --retry 10 --retry-connrefused https://localhost/up
          docker compose exec -T app test -s public/build/manifest.json
          docker compose exec -T -u www-data app php artisan schedule:list --no-interaction
      - name: Check the dieline worker's runtime
        run: docker compose exec -T dielines node --input-type=module -e "await import('./resources/js/dielines/nest.mjs')"
      - name: Back up and restore MariaDB
        run: |
          docker compose exec -T -u www-data app php artisan backup:database --no-interaction
          docker compose exec -T db sh -ec '
              MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot -e "CREATE DATABASE printos_restore;"
          '
          docker compose exec -T app sh -ec 'cat storage/app/private/backups/database/*.sql' |
              docker compose exec -T db sh -ec '
                  MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot printos_restore
                  MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mariadb -uroot printos_restore -e "SELECT COUNT(*) FROM bank_transactions;"
              '
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=120
